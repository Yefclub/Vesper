name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rust:
    # Windows is the platform most of this is used on and the one whose build
    # script is fussiest, so a Linux-only job was checking the easier half.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libpipewire-0.3-dev libclang-dev cmake pkg-config
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check
      # dead_code is allowed on purpose. There are unused variants and helpers
      # that predate this pipeline, and the project rule is to point at
      # pre-existing dead code rather than delete it inside an unrelated change.
      # Everything else is an error, so new lint debt cannot accumulate quietly.
      - name: Clippy
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBCLANG_PATH=$(dirname $(find /usr -name 'libclang.so*' 2>/dev/null | head -1) || echo /usr/lib)
          fi
          cargo clippy --all-targets -- -D warnings -A dead_code
      - name: Unit tests
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBCLANG_PATH=$(dirname $(find /usr -name 'libclang.so*' 2>/dev/null | head -1) || echo /usr/lib)
          fi
          cargo test --lib
