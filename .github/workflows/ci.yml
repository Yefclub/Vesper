name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rust:
    # Windows is the platform most of this is used on and the one whose build
    # script is fussiest, so a Linux-only job was checking the easier half.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libpipewire-0.3-dev libclang-dev cmake pkg-config
      # llama_cpp_sys looks for the LLVM binutils and aborts with "No suitable
      # tool equivalent to nm/objcopy has been found". The Windows image ships
      # LLVM but does not put it on PATH — the same prerequisite AGENTS.md
      # documents for a local checkout.
      - name: LLVM binutils on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin'
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check
      # dead_code is allowed on purpose. There are unused variants and helpers
      # that predate this pipeline, and the project rule is to point at
      # pre-existing dead code rather than delete it inside an unrelated change.
      # Everything else is an error, so new lint debt cannot accumulate quietly.
      - name: Clippy
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBCLANG_PATH=$(dirname $(find /usr -name 'libclang.so*' 2>/dev/null | head -1) || echo /usr/lib)
          fi
          cargo clippy --all-targets -- -D warnings -A dead_code
      - name: Unit tests
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBCLANG_PATH=$(dirname $(find /usr -name 'libclang.so*' 2>/dev/null | head -1) || echo /usr/lib)
          fi
          cargo test --lib

  # The GPU features are off by default, so the job above never compiles them —
  # and a feature nothing builds is a feature that silently stops building. This
  # only compiles: the runners have no GPU, so there is nothing here to run.
  #
  # Vulkan and not CUDA. The CUDA toolkit is a multi-gigabyte install for a
  # second compile of the same code path, and the part that is genuinely
  # different — whisper never getting CUDA — is covered by unit tests in
  # domain::backend that need no toolkit at all.
  gpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev libpipewire-0.3-dev libclang-dev cmake pkg-config
      - name: Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The codename comes from the runner rather than being written here.
          # It used to say `noble`, and the moment the Linux leg moved to 22.04
          # apt started offering packages built against glibc 2.38 to an image
          # carrying 2.35 — sixteen unmet dependencies and "held broken
          # packages", none of which mentioned Vulkan.
          CODENAME=$(lsb_release -cs)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$CODENAME.list" "https://packages.lunarg.com/vulkan/lunarg-vulkan-$CODENAME.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\vulkan.exe" https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          & "$env:RUNNER_TEMP\vulkan.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          $sdk = (Get-ChildItem 'C:\VulkanSDK' | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdk"
          Add-Content -Path $env:GITHUB_PATH -Value "$sdk\Bin"
      - name: LLVM binutils on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin'
      # MSBuild's tracker ignores `LongPathsEnabled`, and the nested
      # `vulkan-shaders-gen` project pushes its log past MAX_PATH from the
      # default workspace: `FileTracker : error FTK1011: could not create the
      # new file tracking log file`. A short target directory is the fix, and
      # it is the same one AGENTS.md documents for a local checkout.
      # MSBuild builds the nested `vulkan-shaders-gen` ExternalProject with its
      # steps on separate parallel nodes, so the install step can start before
      # the configure step has finished: `CMake error : Not a file:
      # .../cmake_install.cmake`. Ninja gets the dependency order right, and is
      # faster besides. The cmake crate supports MSVC with Ninja explicitly — it
      # passes the compiler's absolute path when that pair is in use.
      - name: Ninja generator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          Add-Content -Path $env:GITHUB_ENV -Value 'CMAKE_GENERATOR=Ninja'
      - name: Short target directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CARGO_TARGET_DIR=C:\vt'
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: gpu-${{ matrix.os }}
      - name: Compile with Vulkan
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBCLANG_PATH=$(dirname $(find /usr -name 'libclang.so*' 2>/dev/null | head -1) || echo /usr/lib)
          fi
          cargo build --features gpu-vulkan
