<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vesper</title>
    <!-- Transparent, not the app canvas: this window is a card floating over
         whatever the user is actually looking at, and anything opaque here would
         paint a rectangle around it. -->
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <!-- A file, never an inline block. The production CSP has no `script-src`,
         so `default-src 'self'` blocks inline scripts while `devCsp` allows
         them: inline works under `tauri dev` and fails silently in the bundle. -->
    <script src="/boot-theme.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
